services:
  telemetry-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      langfuse-web:
        condition: service_started
    environment:
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_INIT_PROJECT_SECRET_KEY:?}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - API_KEY=${OTEL_BRIDGE_API_KEY:?}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
      - OTLP_RECEIVER_PORT=4318
      - OTLP_RECEIVER_HOST=0.0.0.0
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-3600000}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-10485760}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4318/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.ccotel-health-http.entryPoints=http
      - traefik.http.routers.ccotel-health-http.middlewares=redirect-to-https
      - traefik.http.routers.ccotel-health-http.priority=100
      - traefik.http.routers.ccotel-health-http.rule=Host(`otel.telemetry.rimthan.army`) && Path(`/health`)
      - traefik.http.routers.ccotel-health-http.service=ccotel-health-http
      - traefik.http.routers.ccotel-health-https.entryPoints=https
      - traefik.http.routers.ccotel-health-https.middlewares=gzip
      - traefik.http.routers.ccotel-health-https.priority=100
      - traefik.http.routers.ccotel-health-https.rule=Host(`otel.telemetry.rimthan.army`) && Path(`/health`)
      - traefik.http.routers.ccotel-health-https.service=ccotel-health-https
      - traefik.http.routers.ccotel-health-https.tls.certresolver=letsencrypt
      - traefik.http.routers.ccotel-health-https.tls=true
      - traefik.http.services.ccotel-health-http.loadbalancer.server.port=4318
      - traefik.http.services.ccotel-health-https.loadbalancer.server.port=4318

  alloy:
    build:
      context: .
      dockerfile: Dockerfile.alloy
    restart: always
    depends_on:
      telemetry-bridge:
        condition: service_healthy
      langfuse-web:
        condition: service_started
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTEL_BRIDGE_API_KEY=${OTEL_BRIDGE_API_KEY:?}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_INIT_PROJECT_SECRET_KEY:?}
    volumes:
      - alloy_data:/var/lib/alloy/data
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.ccotel-alloy-http.entryPoints=http
      - traefik.http.routers.ccotel-alloy-http.middlewares=redirect-to-https
      - traefik.http.routers.ccotel-alloy-http.priority=10
      - traefik.http.routers.ccotel-alloy-http.rule=Host(`otel.telemetry.rimthan.army`)
      - traefik.http.routers.ccotel-alloy-http.service=ccotel-alloy-http
      - traefik.http.routers.ccotel-alloy-https.entryPoints=https
      - traefik.http.routers.ccotel-alloy-https.middlewares=gzip
      - traefik.http.routers.ccotel-alloy-https.priority=10
      - traefik.http.routers.ccotel-alloy-https.rule=Host(`otel.telemetry.rimthan.army`)
      - traefik.http.routers.ccotel-alloy-https.service=ccotel-alloy-https
      - traefik.http.routers.ccotel-alloy-https.tls.certresolver=letsencrypt
      - traefik.http.routers.ccotel-alloy-https.tls=true
      - traefik.http.services.ccotel-alloy-http.loadbalancer.server.port=4318
      - traefik.http.services.ccotel-alloy-https.loadbalancer.server.port=4318

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3.178.0
    restart: always
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      - NEXTAUTH_URL=https://langfuse.telemetry.rimthan.army
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-postgres}
      - SALT=${LANGFUSE_SALT:?}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?}
      - TELEMETRY_ENABLED=${LANGFUSE_TELEMETRY_ENABLED:-false}
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_USE_AZURE_BLOB=false
      - LANGFUSE_USE_OCI_NATIVE_OBJECT_STORAGE=false
      - LANGFUSE_OCI_AUTH_TYPE=workload_identity
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${LANGFUSE_S3_BUCKET:-langfuse}
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:?}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=${LANGFUSE_S3_BUCKET:-langfuse}
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:?}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      - LANGFUSE_S3_BATCH_EXPORT_ENABLED=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_AUTH:?}
      - REDIS_TLS_ENABLED=false
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-}
      - SMTP_CONNECTION_URL=${SMTP_CONNECTION_URL:-}

  langfuse-web:
    image: docker.io/langfuse/langfuse:3.178.0
    restart: always
    depends_on: *langfuse-depends-on
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?}
      - LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID:?}
      - LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-Rimthan}
      - LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_INIT_PROJECT_ID:?}
      - LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-Claude Code OTEL}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_INIT_PROJECT_SECRET_KEY:?}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:?}
      - LANGFUSE_INIT_USER_NAME=${LANGFUSE_INIT_USER_NAME:-Rimthan Admin}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD:?}
      - NEXTAUTH_URL=https://langfuse.telemetry.rimthan.army
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-postgres}
      - SALT=${LANGFUSE_SALT:?}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?}
      - TELEMETRY_ENABLED=${LANGFUSE_TELEMETRY_ENABLED:-false}
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_USE_AZURE_BLOB=false
      - LANGFUSE_USE_OCI_NATIVE_OBJECT_STORAGE=false
      - LANGFUSE_OCI_AUTH_TYPE=workload_identity
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${LANGFUSE_S3_BUCKET:-langfuse}
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:?}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=${LANGFUSE_S3_BUCKET:-langfuse}
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:?}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      - LANGFUSE_S3_BATCH_EXPORT_ENABLED=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_AUTH:?}
      - REDIS_TLS_ENABLED=false
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-}
      - SMTP_CONNECTION_URL=${SMTP_CONNECTION_URL:-}
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.ccotel-langfuse-http.entryPoints=http
      - traefik.http.routers.ccotel-langfuse-http.middlewares=redirect-to-https
      - traefik.http.routers.ccotel-langfuse-http.rule=Host(`langfuse.telemetry.rimthan.army`)
      - traefik.http.routers.ccotel-langfuse-http.service=ccotel-langfuse-http
      - traefik.http.routers.ccotel-langfuse-https.entryPoints=https
      - traefik.http.routers.ccotel-langfuse-https.middlewares=gzip
      - traefik.http.routers.ccotel-langfuse-https.rule=Host(`langfuse.telemetry.rimthan.army`)
      - traefik.http.routers.ccotel-langfuse-https.service=ccotel-langfuse-https
      - traefik.http.routers.ccotel-langfuse-https.tls.certresolver=letsencrypt
      - traefik.http.routers.ccotel-langfuse-https.tls=true
      - traefik.http.services.ccotel-langfuse-http.loadbalancer.server.port=3000
      - traefik.http.services.ccotel-langfuse-https.loadbalancer.server.port=3000

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.7
    restart: always
    user: "101:101"
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/${LANGFUSE_S3_BUCKET:-langfuse} && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: docker.io/redis:7-alpine
    restart: always
    command: >
      --requirepass ${REDIS_AUTH:?}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_AUTH:?}
        - ping
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - TZ=UTC
      - PGTZ=UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  langfuse_postgres_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  langfuse_minio_data:
    driver: local
  langfuse_redis_data:
    driver: local
  alloy_data:
    driver: local
